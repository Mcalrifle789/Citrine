[project]
name = "citrine-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "httpx>=0.27", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citrine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
