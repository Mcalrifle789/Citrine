[project]
name = "citrine-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citrine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
